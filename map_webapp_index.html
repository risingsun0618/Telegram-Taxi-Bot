<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Choose on map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: calc(100% - 64px); }
    .bar {
      height: 64px; display: flex; gap: 10px; align-items: center;
      padding: 10px; box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    input {
      flex: 1; height: 40px; border-radius: 10px; border: 1px solid #ccc;
      padding: 0 12px; font-size: 14px;
    }
    button {
      height: 40px; border-radius: 10px; border: 0;
      padding: 0 14px; font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bar">
    <input id="label" placeholder="Location name will appear here…" readonly />
    <button id="send">Send</button>
  </div>
  <div id="map"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const input = document.getElementById("label");
    const btn = document.getElementById("send");

    const map = L.map('map', { zoomControl: true }).setView([50.4501, 30.5234], 11); // default Kyiv
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    let picked = { lat: null, lon: null, name: "" };

    async function reverseGeocode(lat, lon) {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
      const r = await fetch(url, { headers: { "Accept": "application/json" }});
      if (!r.ok) return "";
      const j = await r.json();
      return j.display_name || "";
    }

    async function setPoint(lat, lon) {
      picked.lat = lat;
      picked.lon = lon;

      if (!marker) marker = L.marker([lat, lon], { draggable: true }).addTo(map);
      marker.setLatLng([lat, lon]);

      picked.name = await reverseGeocode(lat, lon);
      input.value = picked.name || `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    }

    map.on('click', async (e) => {
      await setPoint(e.latlng.lat, e.latlng.lng);
    });

    map.locate({ setView: true, maxZoom: 16 });

    map.on('locationfound', async (e) => {
      // only auto-set if user hasn't picked yet
      if (picked.lat == null) await setPoint(e.latitude, e.longitude);
    });

    function send() {
      if (picked.lat == null || picked.lon == null) return;
      const payload = JSON.stringify(picked);
      if (tg) tg.sendData(payload);
      else alert(payload);
    }

    btn.addEventListener('click', send);

    // Allow dragging marker
    function enableDrag() {
      if (!marker) return;
      marker.on('dragend', async (e) => {
        const p = e.target.getLatLng();
        await setPoint(p.lat, p.lng);
      });
    }
    // add drag handler after first marker
    map.on('click', () => setTimeout(enableDrag, 0));
  </script>
</body>
</html>
